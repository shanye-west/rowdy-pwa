<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/rowdycup-logo.svg" />
    <!-- Brand navy; swapped to the festive red for Christmas Classic at runtime (see Layout). -->
    <meta name="theme-color" content="#132448" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rowdy Cup</title>

    <!-- Preconnect to Firebase origins for faster initial load -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://apis.google.com" />

    <!-- iOS PWA support -->
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <!-- Standardized mobile web app meta (keep apple-prefixed for older iOS compatibility) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque status bar on purpose. With black-translucent, iOS 26+/27 paints
         a Liquid Glass haze (with dark clock/battery text) over the header's
         status-bar inset that no CSS can disable. "default" starts the app below
         an opaque status bar, which iOS colours from a fixed element at the top
         edge (the 1px strip in Layout.tsx) — together with the header-coloured
         html background in index.css. Same recipe as the Putt Pirates app,
         where it's verified on iOS 27. iOS reads this tag only when the app is
         ADDED to the Home Screen: existing installs must be deleted and re-added. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rowdy Cup" />

    <!-- Cold-start splash: paints immediately (before any JS parses) and is
         replaced when React mounts into #root. Keeps startup from being a
         blank white screen on slow networks / cold caches. -->
    <style>
      /* Header colour behind the status bar from the very first paint. */
      html { background-color: #132448; }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #132448;
      }
      .boot-splash img {
        width: 96px;
        height: 96px;
      }
      .boot-splash-spinner {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        animation: boot-spin 0.8s linear infinite;
      }
      /* Christmas Classic pages (pre-applied by the inline script below). */
      html.theme-christmas,
      html.theme-christmas .boot-splash { background-color: #00863c; }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Apply the Christmas Classic theme before first paint if this page last
         rendered in it, so a refresh doesn't flash navy until the tournament
         loads. Key/shape must match src/utils/themeHint.ts. -->
    <script>
      try {
        var hints = JSON.parse(localStorage.getItem("rowdy:christmasPaths") || "{}");
        if (hints && hints[location.pathname] === 1) {
          document.documentElement.classList.add("theme-christmas");
          document.body.classList.add("theme-christmas");
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute("content", "#00863c");
        }
      } catch (e) {}
    </script>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <img src="/images/rowdycup-logo.svg" alt="" />
        <div class="boot-splash-spinner"></div>
      </div>
    </div>
    <script>
      if (document.documentElement.classList.contains("theme-christmas")) {
        var bootImg = document.querySelector(".boot-splash img");
        if (bootImg) bootImg.setAttribute("src", "/images/rowdycup-logo-christmas.svg");
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
